<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} — {{ site.data.profile.name }}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@500&display=swap">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>

<header class="site-header">
  <div class="inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.data.profile.name }}</a>
    <ul class="site-nav">
      <li><a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a></li>
      <li><a href="{{ '/publications.html' | relative_url }}"{% if page.url == '/publications.html' %} aria-current="page"{% endif %}>Publications</a></li>
      <li><a href="{{ '/cv.html' | relative_url }}"{% if page.url == '/cv.html' %} aria-current="page"{% endif %}>Full CV</a></li>
      <li><a href="{{ '/tools.html' | relative_url }}"{% if page.url == '/tools.html' %} aria-current="page"{% endif %}>Tools</a></li>
      <li><a href="{{ '/talks.html' | relative_url }}"{% if page.url == '/talks.html' %} aria-current="page"{% endif %}>Talks</a></li>
      <li><a href="{{ '/stuff.html' | relative_url }}"{% if page.url == '/stuff.html' %} aria-current="page"{% endif %}>Stuff</a></li>
      <li><a href="{{ '/contact.html' | relative_url }}"{% if page.url == '/contact.html' %} aria-current="page"{% endif %}>Contact</a></li>
    </ul>
  </div>
</header>

<div class="wrap">
  {{ content }}
</div>

<footer class="site-footer">
  <p>{{ site.data.site.footer_note }}</p>
  <p class="last-updated">Last updated {{ site.time | date: "%-d %B %Y" }}</p>
  <p class="copyright">&copy; {{ site.time | date: "%Y" }} {{ site.data.profile.name }}. All rights reserved.</p>
</footer>

</body>
</html>
