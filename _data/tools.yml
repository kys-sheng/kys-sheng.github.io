# --- One entry per tool/demo. website, github, huggingface, model and dataset are optional — omit a line to hide that link. ---
# --- "links" is an optional list of extra named links (e.g. several demo pages in one repo): {label, url}. ---

- name: "abc-rpv"
  description: >
    A Python library for the ABC of RPV programme: it takes R-parity violating
    MSSM scenarios with small couplings and works out which collider signature
    they land in, so an enormous space of possible hierarchies collapses to a
    handful of things you can actually search for at the LHC. One can go from couplings to signatures or signatures to possible couplings.
  github: "https://github.com/kys-sheng/abc-rpv"

- name: "BART-L Demo"
  description: >
    A live demo of the BART-Lagrangian model from our SciPost paper. Give it the particle content you care about and the transformer writes out valid
    particle-physics Lagrangians for it. Latex-Conversion by Me, Website by Eliel. The model is also available on Hugging Face.
  huggingface: "https://huggingface.co/spaces/JoseEliel/generate-lagrangians"
  model: "https://huggingface.co/JoseEliel/BART-Lagrangian"
  dataset: "https://huggingface.co/datasets/JoseEliel/lagrangian_generation"

- name: "Theory Space Navigation — BART-L"
  description: >
    A look inside the BART-Lagrangian model rather than at its output: by
    steering activations we walk through the model's latent space to see how it
    organises theories internally. Currently a fixed guided example, with
    interactive controls planned.
  huggingface: "https://huggingface.co/spaces/kys-sheng/TheorySpaceNavigationBARTL"
  model: "https://huggingface.co/JoseEliel/BART-Lagrangian"

- name: "RACNN Bump Hunt Demo"
  description: >
    An interactive bump hunt with an ensemble RACNN-Classiflows model. Change the
    signal position, width, and search window, and watch the histogram, the
    ensemble posteriors for signal+background versus background-only, and other evaluation metrics calculated in real time.
  huggingface: "https://huggingface.co/spaces/kys-sheng/racnn_bumphunt_demo"

- name: "GNN Interactive Viz"
  description: >
    Three browser-based teaching demos, LLM-coded from my own designs. Two walk
    through GNNs — a fully-explained step-by-step visualizer, and a lighter,
    editable directed-kNN demo — showing messages get passed, aggregated, and
    turned into updated node embeddings. The third is a transformer attention
    walkthrough that treats IceCube detector hits as tokens, from input to
    final prediction.
  github: "https://github.com/kys-sheng/gnn_interactive_viz"
  links:
    - label: "GNN visualizer"
      url: "https://kys-sheng.github.io/gnn_interactive_viz/gnn_interactive_viz_with_explanation.html"
    - label: "Directed kNN demo"
      url: "https://kys-sheng.github.io/gnn_interactive_viz/dgnn_editable.html"
    - label: "Transformer for IceCube"
      url: "https://kys-sheng.github.io/gnn_interactive_viz/transformer.html"

- name: "Monte Carlo Tree Search for Hex"
  description: >
    A Hex game engine built around the Monte Carlo Tree Search algorithm — not
    a physics project, just something I built for fun during my MSc. It
    predates my GitHub use, so there's no repo to link here unfortunately.
    Code exists somewhere on the hard disk of my now-dead old laptop. RIP.
  links:
    - label: "Monte Carlo Tree Search"
      url: "https://en.wikipedia.org/wiki/Monte_Carlo_tree_search"
    - label: "Hex (board game)"
      url: "https://en.wikipedia.org/wiki/Hex_(board_game)"
