# One or more paragraphs. Add a new "- >" block for each paragraph.
bio:
  - >
    I build machine learning systems that search for interpretable, symbolic
    descriptions of physical phenomena — conservation laws, closed-form
    potentials, effective equations — directly from data and simulation,
    rather than opaque black-box fits.
  - >
    My background spans physics and computer science, and most of my work
    sits at the point where a learned model has to hand back something a
    physicist can actually check by hand.

