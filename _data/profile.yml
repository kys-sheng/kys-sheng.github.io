# One or more paragraphs. Add a new "- >" block for each paragraph.
bio:
  - > 
    Hi! Im Yong Sheng (or just Sheng), I like fundamental science, learning through research, build stuff that's hopefully useful, and many more things. Currently trying to stay in academia as long as it will allow me. 
  - >
    I care about how the world works from a fundamental point of view. I am drawn to underlying structure and principles rather than to any single successful instance or usecase of it. I crave to see mind-blowing discoveries and not just another incremental extension of what we already know. 
  - >
    My background is in physics, but I have grown fond of machine learning and computer science. Most of my current work develops machine learning models for problems in fundamental physics. I value whole new approaches to science (Faster with AI is not enough, it needs to be new and hopefully better!) :)
  - >
    When Im not working, I boulder, dance salsa, play guitar/piano, write poems, drink beer and lepak at mamak stalls and kopitiams, but I guess that's already too much personal information here. Be kind and be curious! :)

