# One or more paragraphs. Add a new "- >" block for each paragraph.
bio:
  - > 
    Hi! Im Yong Sheng (or just Sheng), I like physics and science and research and many stuff, currently trying to stay in academia as long as it will allow me. 
  - >
    I care about how the world works from a fundamental point of view. Mathematics for its own sake is fun and amazing, but what excites me is mathematics bound by reality.
    I am drawn to the underlying structure rather than to any single successful instance of it.
  - >
    My background is in physics, but I have grown fond of machine learning and computer science. Most of my current work develops machine learning models for problems in fundamental physics. I want whole new approaches to science: faster with AI is not enough, it needs to be new and/or better! :)

