# One or more paragraphs. Add a new "- >" block for each paragraph.
bio:
  - >
    Hi! I'm Yong Sheng (or just Sheng). I like fundamental science, learning through research, building stuff that's hopefully useful, and many more things. Currently, trying to do research as long as I can.
  - >
    I care about how the world works from a fundamental point of view. I am drawn to underlying structure and principles rather than to any single successful instance or use case of it. I crave mind-blowing discoveries and not just another incremental extension of what we already know.
  - >
    My background is in physics, but I have grown fond of machine learning and computer science. Most of my current work develops machine learning models/methods for problems in fundamental physics. I value whole new approaches to science. Faster with AI is not enough; it needs to be new and hopefully better!
  - >
    Be kind and be curious! :)

