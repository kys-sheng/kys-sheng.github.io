intro: "Details on what I care about and where I want to take it."

body:
  - "My research journey is built on wanting a bird's-eye view across fundamental science, with pockets of depth (and hopefully lasting contributions) wherever I happen to dig in along the way. I'm quite sure my research interests will keep changing over time, while this approach remains."
  - "What draws me in is usually the structures and patterns of a field itself, and anything aimed at genuinely new physics, rather than just applying known physics to produce new successful instances of it (i.e. new things with old physics). That's why I have a strong interest in building new methods, or using existing ones in unique ways, such that they open up new ways of approaching existing problems. Hence why I'm currently super into machine learning. These models and methods need to be easily accessible by researchers and/or transferable to different domains, so that we can impact beyond our own research. Closed models or bad UI usually lead us nowhere as a community."
  - '<strong>Current main research focus:</strong><br>ML for math &amp; theoretical physics, representation engineering, interpretability, Platonic/Aristotelian Representation Hypothesis.<br>(See <a href="https://doi.org/10.21468/SciPostPhys.21.1.024" target="_blank" rel="noopener">BART-L</a>, <a href="https://huggingface.co/spaces/kys-sheng/TheorySpaceNavigationBARTL" target="_blank" rel="noopener">Steering paper</a>.)'
  - '<strong>Other research interests with experience:</strong><br>amortization, SBI, foundation models, BSM-dictionary (a continuation of abc-rpv).<br>(See <a href="https://huggingface.co/spaces/kys-sheng/racnn_bumphunt_demo" target="_blank" rel="noopener">RACNN paper</a>, <a href="https://doi.org/10.1007/JHEP07(2023)215" target="_blank" rel="noopener">1st abc-rpv paper</a>.)'
  - "<strong>Other research interests with little or no experience:</strong><br>graph theory (hypergraphs), string theory (the string landscape), statistical physics for ML, neural network field theory, active inference, emergence, early universe cosmology, astroparticle physics, semiotics (the study of symbols and signs), and more."
  - "I think of myself as a physicist first, not as a 'particle physicist', a 'collider physicist', a 'condensed matter physicist', a 'BSM guy', a 'SUSY guy', a 'theorist', a 'pheno guy', or any other label. Having experience in one area doesn't mean it's the only thing I can do, or the only thing I want to do. While I'm grateful for what I get to learn from each project I've done, I don't want to be constrained by what I've already worked on. As with most research journeys, projects are sometimes chosen by circumstance rather than choice."
  - "As such, ask me what I'm really into at any given point, rather than assuming my interest based on what I've done. Currently, my publications mainly show my experience; hopefully, over time, they'll show my interests too."
