- title: "Generating particle physics Lagrangians with transformers"
  authors: "<strong>Y. S. Koay</strong>, R. Enberg, S. Moretti, J. E. Camargo-Molina"
  venue: "SciPost Phys. 21, 024 (2026)"
  link: "https://doi.org/10.21468/SciPostPhys.21.1.024"
  tags: ["Machine Learning", "Transformers", "Symbolic Generation", "Particle Physics"]
  popsci: >
    Can AI write the equations that describe universes? Yes — and better than I could as a master's student.
    A Lagrangian is the compact formula that defines a particle physics model, and it works a lot like language: fields are the words, the terms built from them are the sentences, and symmetry is the grammar holding it all together. Change one word and the sentence means something else; change one term and you change everything the model predicts, from how the universe evolved to what we should see in today's experiments. We taught a transformer that grammar — and it writes valid Lagrangians for particle content it has never seen. Main contribution by Me and Eliel!

