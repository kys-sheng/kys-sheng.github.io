# --- One entry per publication, newest first. Copy a block below and edit it to add a new paper. ---
# `authors` allows inline HTML (<strong>) so the owner's name can be highlighted.

- title: "Generating particle physics Lagrangians with transformers"
  authors: "<strong>Y. S. Koay</strong>, R. Enberg, S. Moretti, J. E. Camargo-Molina"
  venue: "SciPost Phys. 21, 024 (2026)"
  link: "https://arxiv.org/abs/2501.09729"
  popsci: >
    Can AI write the equations that describe universes? Yes — and better than I could as a master's student. 
    A Lagrangian is the compact formula that defines a particle physics model, and it works a lot like language: fields are the words, the terms built from them are the sentences, and symmetry is the grammar holding it all together. Change one word and the sentence means something else; change one term and you change everything the model predicts, from how the universe evolved to what we should see in today's experiments. We taught a transformer that grammar — and it writes valid Lagrangians for particle content it has never seen.

