- title: "The ABC of RPV: classification of R-parity violating signatures at the LHC for small couplings"
  authors: "H. K. Dreiner, <strong>Y. S. Koay</strong>, D. Köhler, V. M. Lozano, J. Montejo Berlingen, S. Nangia, N. Strobbe"
  venue: "JHEP 07 (2023) 215"
  link: "https://arxiv.org/abs/2306.07317"
  popsci: >
    R-parity violating supersymmetry has too many possible signatures to look for in the collider. 
    Instead we classify what the theory can produce into a finite number of collider signatures. 
    14!~9·10^10  possible hierarchies and corresponding search possibilities reduced to 6 distinct signatures.
    We showed for LLE case here. I wrote the package to look for the signatures and did the collider analysis for the LLE case.
    Idea and main contribution by Saurabh! 
