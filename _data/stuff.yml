sections:
  - heading: "Fun facts"
    items:
      - title: "abc-rpv is NP-complete"
        text:
          - "In the abc-rpv project, finding the minimal set of signatures that can cover the full set of possibilities is a set cover problem (NP-complete)."
        source: ""
      - title: "Breaking the Turing test with a simple prompt"
        text:
          - "If you ask an LLM to count how many 1s are in a string of 1s and 0s, without explanation and without writing Python code, the probability of it giving the wrong answer is non-zero. It's an architectural issue, and arguably a way to break the Turing test. :)"
          - 'Example prompt: "10111010000010101 how many ones are there? Just answer, no explanation, no python code writing."'
          - "Success rate varies based on model version, forced chain-of-thought options, and random seed/temperature."
          - "If it fails, add more 1s and 0s into your sequence randomly. :)"
        source: ""

