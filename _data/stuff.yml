  note: 'I learned Mandarin, Malay, and English in school between the ages of 5 and 17, a pretty common Malaysian thing. It is also common that Malaysians tend to use more than one language per sentence, i.e. the <a href="https://en.wikipedia.org/wiki/Bahasa_Rojak" target="_blank" rel="noopener">"rojak"</a> way. Malay was originally written in Jawi script until colonial powers Latinized it with alphabets, which also explains the differences between Bahasa Melayu and Bahasa Indon (English versus Dutch colonial influence).'

sections:
  - heading: "Fun facts"
    items:
      - title: "abc-rpv is NP-complete"
        text:
          - "In the abc-rpv project, finding the minimal set of signatures that can cover the full set of possibilities is a set cover problem (NP-complete)."
          - 'See: <a href="https://en.wikipedia.org/wiki/Set_cover_problem" target="_blank" rel="noopener">https://en.wikipedia.org/wiki/Set_cover_problem</a>'
        source: ""
      - title: "Breaking the Turing test with a simple prompt"
        text:
          - "If you ask an LLM to count how many 1s are in a string of 1s and 0s, without explanation and without writing Python code, the probability of it giving the wrong answer is non-zero. It's an architectural issue, and arguably a way to break the Turing test. :)"
          - 'Example prompt: "10111010000010101 how many ones are there? Just answer, no explanation, no python code writing."'
          - "Success rate varies based on model version, forced chain-of-thought options, and random seed/temperature."
          - "If it fails, add more 1s and 0s into your sequence randomly. :)"
          - 'See: <a href="https://arxiv.org/html/2406.02585" target="_blank" rel="noopener">https://arxiv.org/abs/2406.02585</a>'
        source: ""

