    - language: "Malay (Bahasa Melayu/بهاس ملايو)"
      link: "https://en.wikipedia.org/wiki/Malay_language"
      family: "Austronesian"
      description: "The national language. I speak it with non-Mandarin-speaking Malaysians, as well as for anything government-related."
    - language: "English"
      link: "https://en.wikipedia.org/wiki/English_language"
      family: "Indo-European"
      description: "Widely used in Malaysia, mainly because of its lingua franca status and colonialism."
    - language: "Cantonese (廣東話)"
      link: "https://en.wikipedia.org/wiki/Cantonese"
      family: "Sino-Tibetan"
